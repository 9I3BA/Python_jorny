{% extends 'base.html' %}
{% block title %}Новое задание{% endblock %}
{% block extra_css %}
<style>
.file-upload-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border: 2px dashed var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  color: var(--text-secondary);
  font-size: 14px;
}
.file-upload-label:hover {
  border-color: #FF6600;
  background: rgba(255,102,0,.05);
  color: var(--text-primary);
}
.file-upload-label.has-file {
  border-color: #4CAF50;
  background: rgba(76,175,80,.06);
  color: #4CAF50;
}
.file-upload-icon { font-size: 20px; flex-shrink: 0; }
.file-input-hidden { display: none; }
.form-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
</style>
{% endblock %}
{% block content %}
<div class="page-form">
  <div class="form-card">
    <div class="form-card-header">
      <a href="{{ url_for('teacher_dashboard') }}" class="back-btn">← Назад</a>
      <h1>📝 Новое задание</h1>
    </div>
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label class="form-label">Название задания *</label>
        <input type="text" name="title" class="form-input" placeholder="Например: Домашнее задание №1" required>
      </div>
      <div class="form-group">
        <label class="form-label">Описание задания</label>
        <textarea name="description" class="form-input" rows="5" placeholder="Опиши что нужно сделать..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Прикрепить файл</label>
        <label class="file-upload-label" id="fileLabel">
          <span class="file-upload-icon">📎</span>
          <span id="fileText">Выбрать файл...</span>
          <input type="file" name="file" id="assignmentFile" class="file-input-hidden"
                 onchange="updateFileLabel(this)">
        </label>
        <div class="form-hint">PDF, изображение, документ — любой формат</div>
      </div>
      <div class="form-group">
        <label class="form-label">Группа</label>
        <select name="group_id" class="form-input">
          <option value="">Все ученики</option>
          {% for g in groups %}
          <option value="{{ g.id }}">{{ g.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Срок сдачи</label>
        <input type="datetime-local" name="due_date" class="form-input" id="dueDateInput">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Создать задание ✓</button>
        <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-secondary">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
// Minimum date in MSK (UTC+3)
function mskNowStr() {
  // now.getTime() is UTC ms; adding 3h gives a Date whose toISOString digits = MSK clock
  const msk = new Date(Date.now() + 3 * 60 * 60 * 1000);
  return msk.toISOString().slice(0, 16);
}

(function() {
  const inp = document.getElementById('dueDateInput');
  if (inp) inp.min = mskNowStr();
})();

document.querySelector('form').addEventListener('submit', function(e) {
  const inp = document.getElementById('dueDateInput');
  if (inp.value && inp.value <= mskNowStr()) {
    e.preventDefault();
    inp.setCustomValidity('Срок сдачи должен быть в будущем (МСК)');
    inp.reportValidity();
    return;
  }
  inp.setCustomValidity('');
});

function updateFileLabel(input) {
  const label = document.getElementById('fileLabel');
  const text  = document.getElementById('fileText');
  if (input.files && input.files[0]) {
    text.textContent = input.files[0].name;
    label.classList.add('has-file');
  } else {
    text.textContent = 'Выбрать файл...';
    label.classList.remove('has-file');
  }
}
</script>
{% endblock %}
